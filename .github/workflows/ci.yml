# CI for schedprobe.
#
# Design notes (keep them in sync with the workflow, not with wishful thinking):
#   * The test suite is plain stdlib ``unittest`` on purpose - it must run in a
#     locked-down environment without a pytest plugin ecosystem. pytest is installed
#     only because it is in the ``dev`` extra; it is NOT the primary runner here.
#   * ``python -m pip install -e ".[dev]"`` is the only install step: the package
#     itself has zero runtime dependencies (pyproject.toml: dependencies = []).
#   * ``ruff check .`` lints the whole repository. pyproject.toml's
#     [tool.ruff.lint.per-file-ignores] exempts ``tests/*`` (PLR2004, SLF001),
#     ``bench/*`` (T201) and three modules where lazy imports are deliberate
#     (cli/*, backends/base.py, config.py).
#   * Every step below was run locally on Python 3.14 against this commit before it was
#     pushed: ``ruff check`` clean, ``ruff format --check`` clean, ``mypy`` clean,
#     225 tests passing. The 3.11/3.12/3.13 legs are the only part that cannot be
#     reproduced locally; the first push of this repository failed on ``ruff check``
#     precisely because the tooling had not been installed in the authoring environment.
#   * The benchmark smoke step is expected to write artifacts: the harness writes to
#     ``bench/runs/`` and ``scripts/run_published_bench.py`` also rewrites
#     ``docs/research/benchmark-raw.json`` (see RAW_PATH in that script). That is
#     intended for a smoke run; the outputs are uploaded as build artifacts and are
#     never committed back to the repository.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests (stdlib unittest)
        run: python -m unittest discover -s tests -t . -v

      - name: Evidence tiers of the suite
        # Prints how many tests can actually falsify a belief (oracle), how many guard a
        # consumer-facing interface (contract), and how many only check the code against
        # its own documentation (consistency). It is here so that a reviewer sees the
        # number on every run rather than reading a claim about it in a README.
        run: python scripts/test_tiers.py

      - name: Network condition tests must actually run, not skip
        # tests/test_netem.py injects packet loss and delay through a network namespace and
        # `tc netem`. It is the only real-socket coverage for the FILTERED path, and on a
        # Linux runner with root it has no excuse to skip - a silent skip would make a
        # green build mean nothing, which is worse than a red one. So the skip is turned
        # into a failure here rather than being left to look like success.
        run: |
          python -m unittest tests.test_netem -v 2>&1 | tee netem.log
          if grep -q "skipped" netem.log; then
            echo "::error::the injected-loss tests skipped on a Linux runner, so the FILTERED path is untested by this build"
            exit 1
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict settings from pyproject.toml)
        run: mypy src/schedprobe

      - name: Benchmark smoke (deterministic simulator, no network access)
        # The simulator backend is used for every scenario, so this step never
        # contacts a remote host. It is a smoke test of the harness end to end:
        # it must not raise, and it must produce bench/ artifacts.
        run: python scripts/run_published_bench.py 2>&1 | tee bench-published.ci.txt

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-python-${{ matrix.python-version }}
          path: |
            bench/
            bench-published.ci.txt
            docs/research/benchmark-raw.json
          if-no-files-found: warn
          retention-days: 14
